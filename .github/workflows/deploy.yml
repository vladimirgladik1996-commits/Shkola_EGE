# Автодеплой backend через SSH. Сейчас прод-деплой идёт через Render (render.yaml
# в корне репозитория, autoDeploy при пуше в main), поэтому этот SSH-сценарий
# переведён в ручной запуск: Actions → deploy → Run workflow.
#
# После перестройки репозитория (dev/ и prod/) деплой собирает каталог
# prod/bot-mini-app — на сервере путь: /opt/tutor-app/prod/bot-mini-app.
#
# Настройка (для SSH-сценария, однократно, в GitHub: Settings → Secrets and
# variables → Actions):
#   SERVER_HOST   — адрес сервера
#   SERVER_USER   — пользователь SSH
#   SERVER_SSH_KEY — приватный SSH-ключ (его место здесь, а не в чате)
name: deploy

on:
  workflow_dispatch:
  # push в main больше не триггерит этот workflow:
  #   push:
  #     branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=accept-new \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'cd /opt/tutor-app/prod/bot-mini-app && sh deploy.sh'
