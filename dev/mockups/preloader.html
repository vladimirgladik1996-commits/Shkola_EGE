@keyframes up{from{transform:translateY(calc(var(--vh)*1.06)) rotate(calc(var(--r)*-1))}to{transform:translateY(-32vmin) rotate(var(--r))}}
@keyframes dn{from{transform:translateY(-32vmin) rotate(calc(var(--r)*-1))}to{transform:translateY(calc(var(--vh)*1.06)) rotate(var(--r))}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.1%)}}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.014,1.022)}}
@keyframes glow{0%,100%{opacity:.1;transform:scale(.75)}50%{opacity:.95;transform:scale(1.15)}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}
@keyframes st{to{background-position:25.5px 0,0 0}}
@keyframes capb{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14%) rotate(6deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{to{background-position:240px 240px}}
@keyframes bk{0%{transform:translateY(0) scale(.7);opacity:0}15%{opacity:.55}100%{transform:translateY(-55vh) scale(1.2);opacity:0}}
@keyframes dt{0%,25%{opacity:.15}55%{opacity:1}100%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.rays,.doodle,.bk,.art,.l,.glow,.sp,#f,.cap{animation-duration:14s}.fi{animation-duration:70s!important}}

<script>
(function(){
var $=function(i){return document.getElementById(i)},fill=$('f'),pct=$('p'),st=$('s'),btn=$('r'),cap=$('cp'),
nat=!!window.NativePreloader,t0=Date.now(),real=0,shown=0,done=false,failed=false,hold=0;
function msg(s){return s<5?'Соединяемся с сервером…':s<25?'Будим сервер, подождите…':'Почти готово, ещё чуть-чуть…'}
window.__real=function(p){real=Math.max(real,p)};          // реальный прогресс WebView (0–100)

window.__fail=function(){failed=true;st.textContent='Не удалось подключиться. Проверьте интернет.';btn.hidden=false};
window.__reset=function(){failed=false;done=false;real=0;shown=0;t0=Date.now();btn.hidden=true};
btn.onclick=function(){window.__reset();if(nat)window.NativePreloader.retry()};
function frame(){
 var sec=(Date.now()-t0)/1000;
 if(!nat&&!done&&sec>9)done=true;                           // демо в браузере: зацикливаем
 if(!failed){
  var tgt=done?100:Math.min(93,Math.max(real*.9,93*(1-Math.exp(-sec/22))));
  shown+=(tgt-shown)*(done?.12:.04);if(done&&shown>99.5)shown=100;
  st.textContent=done?'Готово!':msg(sec);
 }
 fill.style.width=shown+'%';cap.style.left=(4+shown*.92)+'%';pct.textContent=Math.round(shown)+'%';
 if(!nat&&done&&shown>=100){if(!hold)hold=Date.now();if(Date.now()-hold>1600){hold=0;window.__reset()}}
 requestAnimationFrame(frame)
}
frame()
})();
