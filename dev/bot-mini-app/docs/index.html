<title>Надежда · Кабинет репетитора</title>
<style>
:root{--bg:#FBF7E9;--tx:#0E2250;--hint:#66719A;--card:#fff;--acc:#0F2E6E;--on:#fff;--red:#D64545;--grn:#1F9A5B;--ln:#E9E1C8;--yel:#FFC93C;--yon:#0E2250;--bbg:#0F2E6E;--sh:rgba(15,46,110,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}

h3{font-size:19px;margin-bottom:2px;padding-right:44px}
h2{font-size:15px;margin:14px 2px 8px}
.bar{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.bar .ttl{flex:1;text-align:center;font-size:14px}
.pill{padding:8px 13px;border-radius:99px;background:var(--card);font-weight:600;font-size:13px;white-space:nowrap}

.chips{display:flex;gap:6px;overflow-x:auto;flex:1}

.wg{min-width:680px}
.wh,.wb{display:grid;grid-template-columns:38px repeat(7,1fr)}
.wh b{font-size:11px;text-align:center;padding:5px 2px;border-left:1px solid var(--ln);font-weight:700;white-space:nowrap;display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.1}

.tl{position:relative}
.tl i{position:absolute;right:4px;font-style:normal;font-size:10px;color:var(--hint);transform:translateY(-6px)}
.col{position:relative;border-left:1px solid var(--ln);background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hh) - 1px),var(--ln) calc(var(--hh) - 1px),var(--ln) var(--hh))}

.bw .wh,.bw .wb{grid-template-columns:46px repeat(7,1fr)}
.bw .wh{border-bottom:1.6px solid #111}

.bw .col{border-left:1px solid #555;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hh)/2 - 1px),#cfcfcf calc(var(--hh)/2 - 1px),#cfcfcf calc(var(--hh)/2)),repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hh) - 1px),#555 calc(var(--hh) - 1px),#555 var(--hh)),repeating-linear-gradient(to bottom,#fff 0,#fff var(--hh),#f4f4f4 var(--hh),#f4f4f4 calc(var(--hh)*2))}

.paper h4{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:8px}

.g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}

.row,.feed,.srow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:6px;cursor:pointer}
.info{flex:1;min-width:0}.info b{display:block;font-size:15px}.info small{color:var(--hint);font-size:12.5px}
.av{flex:none;width:40px;height:40px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.av.big{width:76px;height:76px;font-size:26px;margin:0 auto 10px}
.phc{display:flex;flex-direction:column;align-items:center;gap:10px;margin:2px auto 12px}
.phc .av{width:96px;height:96px;font-size:34px;margin:0;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}.seg button{padding:11px;border-radius:12px;background:var(--card);font-weight:600;font-size:14px}.seg button.on{background:var(--acc);color:var(--on)}
.srch{margin:0 0 8px}.sbar{display:flex;gap:6px;margin-bottom:10px}.sbar .srch{flex:1;min-width:0;margin:0}.ib{position:relative;flex:none;width:46px;height:46px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;cursor:pointer;margin:0;color:var(--tx)}.ib.on,.ib.acc{background:var(--acc);color:var(--on)}.ib select{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;padding:0}.calg button.cd{position:relative;aspect-ratio:1;border-radius:10px;font-size:14px;background:var(--card)}.calg .cd.rng{background:color-mix(in srgb,var(--acc) 25%,var(--card))}.calg .cd.sel{background:var(--acc);color:var(--on);font-weight:700}.calg .cd.tdy{outline:1.5px solid var(--acc)}.calg .cd u{position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;opacity:.6}.btn:disabled{opacity:.45}.gauge{display:block;width:100%;border-radius:14px;padding:13px;font-size:22px;font-weight:800;text-align:center;color:#fff;margin-top:12px}.gauge.gzero{background:#2e9e5b}.gauge.gpos{background:#14573a}.gauge.gneg{background:#d64545}.gcap{text-align:center;font-weight:600;margin:6px 0 14px}.phr{display:flex;align-items:center;gap:12px;margin-bottom:12px}.phb{display:flex;gap:6px;flex-wrap:wrap}.bal.neg{border-color:var(--red);color:var(--red)}.flt{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}.flt select{margin:0;padding:11px;font-size:14px}
.dstats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:6px}.dstats .stat b{font-size:16px}
.dh{font-size:15px;margin:18px 0 8px}
.avg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.avgc{background:var(--card);border-radius:14px;padding:14px 12px;border-left:4px solid var(--acc)}.avgc span{display:block;color:var(--hint);font-size:12px;margin-bottom:4px}.avgc b{font-size:19px}
.hb{background:var(--card);border-radius:14px;padding:12px}.hbr{display:grid;grid-template-columns:78px 1fr auto;gap:8px;align-items:center;padding:5px 0;font-size:13px}.hbn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbt{height:14px;background:var(--bg);border-radius:7px;overflow:hidden}.hbt i{display:block;height:100%;background:var(--red);border-radius:7px}
.pos{color:var(--grn)}.neg{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.stat{background:var(--card);border-radius:14px;padding:10px}.stat small{display:block;color:var(--hint);font-size:12px}
.empty{color:var(--hint);text-align:center;padding:18px 0}
#fab{position:fixed;right:14px;bottom:calc(72px + env(safe-area-inset-bottom,0px));padding:13px 20px;border-radius:99px;background:var(--acc);color:var(--on);font-weight:600;box-shadow:0 4px 14px #0003}

.bd{position:absolute;inset:0;background:#0006}

.pen{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:var(--card);font-size:16px}
.sub{color:var(--hint);margin-bottom:10px}
label{display:block;font-size:13px;color:var(--hint);margin-bottom:10px}

.btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.btn{padding:14px;border-radius:14px;background:var(--card);font-weight:600}
.btn.pri{background:var(--acc);color:var(--on)}.btn.dng{color:var(--red)}
.cst{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}
.bal{border-radius:14px;padding:12px;margin-bottom:12px;font-weight:600;text-align:center;border:1.5px solid var(--ln)}
.pscroll{flex:1;overflow:auto;padding:14px 12px}
.paper{background:#fff;color:#111;padding:14px;border-radius:4px;box-shadow:0 2px 14px #0004;width:842px;min-width:842px}
.paper h4{font-size:19px;border-bottom-width:1.6px;padding-bottom:7px;margin-bottom:8px}.paper p{color:#666;font-size:12px;margin-bottom:8px}
.paper .sc{border-color:#999;border-radius:0}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:50;display:none;font-size:14px}
.note{font-size:12px;color:var(--hint);text-align:center;margin-top:14px}

.dseg{display:flex;gap:4px;margin-bottom:12px;background:var(--card);padding:4px;border-radius:14px}

.dseg button.on{background:var(--bg);color:var(--tx);box-shadow:0 2px 8px -2px #0003}
.hero{border-radius:24px;padding:20px 18px 16px;color:#fff;margin-bottom:10px;background:radial-gradient(120% 140% at 100% 0,#ffffff29,transparent 55%),linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 48%,#000));box-shadow:0 16px 32px -18px var(--acc)}
.hero small{opacity:.82;font-size:13px}
.hero .big{font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.hm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid #ffffff33}
.hm b{display:block;font-size:15px;font-variant-numeric:tabular-nums}.hm span{font-size:11.5px;opacity:.78}
.kp3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kp{position:relative;overflow:hidden;background:var(--card);border-radius:18px;padding:13px 10px 10px}
.kp::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--kc)}
.kp small{display:block;color:var(--hint);font-size:11.5px}.kp b{display:block;font-size:15.5px;margin:3px 0 1px;font-variant-numeric:tabular-nums;white-space:nowrap}.kp em{font-style:normal;font-size:11px;color:var(--hint)}
.pc{background:var(--card);border-radius:22px;padding:16px 14px;margin-bottom:10px}
.pch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.pch h3{font-size:16px;padding:0;margin:0;white-space:nowrap}.pch span{font-size:12.5px;color:var(--hint);text-align:right}.pch span b{color:var(--tx)}
.ax{font-size:9px;fill:var(--hint);font-variant-numeric:tabular-nums}
.dn circle{transition:stroke-width .25s,opacity .25s}
.lg{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;padding:9px 8px;border-radius:12px;font-size:13.5px;cursor:pointer;transition:background .2s}
.lg.on{background:var(--bg)}.lg .dot{width:12px;height:12px;border-radius:4px}.lgp{color:var(--hint);min-width:36px;text-align:right}
.dis .tr{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;margin-bottom:6px}.dis .tr i{display:block;height:100%;border-radius:4px;background:var(--dc)}
.dr{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 0;cursor:pointer}.dr+.dr{border-top:1px solid var(--ln)}
.dr .bt{height:6px;border-radius:3px;background:var(--bg);margin-top:6px;overflow:hidden}.dr .bt i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#e8837f,var(--red))}
.av.sm{width:34px;height:34px;font-size:13px}
@keyframes grw{from{transform:scaleY(0)}}@keyframes fdi{from{opacity:0;transform:translateY(8px)}}
.an .hero,.an .kp,.an .pc{animation:fdi .45s both}.an .kp:nth-child(2){animation-delay:.05s}.an .kp:nth-child(3){animation-delay:.1s}
.an .bx{transform-box:fill-box;transform-origin:bottom;animation:grw .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*14ms)}
@media (prefers-reduced-motion:reduce){.an *{animation:none!important}}

.fc{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:-2px 0 6px}
.fb{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--bg);margin:4px 0 10px}.fb i{display:block;height:100%}
.fb .r,.fl .r{background:var(--acc)}.fb .e,.fl .e{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--acc) 60%,transparent) 0 4px,color-mix(in srgb,var(--acc) 22%,transparent) 4px 8px)}.fb .d,.fl .d{background:color-mix(in srgb,var(--red) 38%,transparent)}
.fl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;font-size:13.5px}.fl span{display:flex;align-items:center;gap:8px;min-width:0}.fl i{flex:none;width:12px;height:12px;border-radius:4px}.fl b{font-variant-numeric:tabular-nums;white-space:nowrap}

.fbars>div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}

/* ===================== Бренд «Надежда» ===================== */
html,body{overflow-x:clip}
body{font-family:"Nunito",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:72px 10px 112px}
h3,h2{font-weight:800}
.pill,.seg button,.dseg button,.btn{font-weight:700}
:focus-visible{outline:2.5px solid var(--yel);outline-offset:2px}
.row,.feed,.srow,.stat,.avgc,.hb,.pc,.kp,.d{box-shadow:0 0 0 1px var(--ln)}
.row,.feed,.srow{border-radius:16px}
.pc{border-radius:24px}
.sc{background:var(--card);border-radius:16px}.paper .sc{background:#fff}
.d.tod{background:color-mix(in srgb,var(--yel) 34%,var(--card));outline:2px solid var(--yel)}
.wh b.td em{background:var(--yel);color:var(--yon)}
.hero{background:radial-gradient(120% 140% at 100% 0,#FFC93C47,transparent 55%),linear-gradient(135deg,#1B4AAE,#0B2257);box-shadow:0 16px 32px -18px #0B2257}
.btn.pri,.pill.on,.seg button.on{box-shadow:0 6px 14px -8px var(--sh)}
#fab{bottom:calc(22px + env(safe-area-inset-bottom,0px));right:16px;z-index:6;padding:14px 22px;background:var(--yel);color:var(--yon);font-weight:900;font-size:15.5px;box-shadow:0 10px 22px -8px rgba(15,46,110,.55),inset 0 -3px 0 rgba(0,0,0,.1);transition:transform .15s}
#fab:active{transform:scale(.95)}
#toast{background:#0E2250;color:#fff;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:70;border:1px solid #ffffff30;box-shadow:0 8px 22px -8px #0008}

/* --- верхняя панель --- */
#top{position:fixed;z-index:5;top:0;left:0;right:0;height:calc(56px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0 68px;display:flex;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:box-shadow .25s}
#top.scr{box-shadow:0 1px 0 var(--ln),0 10px 18px -14px var(--sh)}
#ttl{display:inline-block;font-size:21px;font-weight:900;letter-spacing:-.01em;white-space:nowrap}
#tmk{display:none}

/* --- кнопка-гамбургер --- */
#burger{position:fixed;z-index:60;left:10px;top:calc(env(safe-area-inset-top,0px) + 6px);width:44px;height:44px;border-radius:14px;background:var(--bbg);display:grid;place-content:center;box-shadow:0 6px 14px -8px var(--sh);transition:background .3s,transform .2s,box-shadow .3s}
#burger:active{transform:scale(.92)}
#burger i{display:block;width:22px;height:3px;border-radius:3px;background:#fff;transition:transform .42s cubic-bezier(.5,1.6,.4,1),opacity .2s,width .3s}
#burger i+i{margin-top:4.5px}
#burger i:nth-child(2){width:14px;background:var(--yel);justify-self:start}
#burger.on{box-shadow:0 0 0 1.5px #ffffff38}
#burger.on i:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
#burger.on i:nth-child(2){transform:scaleX(0);opacity:0}
#burger.on i:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
body:has(#sheet.on) #burger,body:has(#pr.on) #burger{z-index:6}

/* --- выезжающее меню --- */
#scrim{position:fixed;inset:0;z-index:40;background:rgba(8,22,60,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .34s ease,visibility 0s .34s}
#scrim.on{opacity:1;visibility:visible;transition-delay:0s}
#drawer{position:fixed;z-index:50;top:0;bottom:0;left:0;width:min(84vw,330px);display:flex;flex-direction:column;overflow:hidden;touch-action:pan-y;background:var(--bg);border-radius:0 28px 28px 0;box-shadow:12px 0 40px -10px rgba(5,14,40,.5);transform:translateX(-104%);visibility:hidden;will-change:transform;transition:transform .34s cubic-bezier(.32,.72,0,1),visibility 0s .34s}
#drawer.on{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.22,1,.36,1),visibility 0s}

/* ===== Патч: форма занятия, список классов, календарь, анимация «карточка → ячейка дня» ===== */
@keyframes shUp{from{transform:translateY(46px);opacity:0}}

.sh{border-radius:28px 28px 0 0;box-shadow:0 -12px 40px -14px rgba(5,14,40,.5)}
.hid{display:none!important}
input,select{box-shadow:0 0 0 1px var(--ln)}
/* выбор ученика */
.stc{display:flex;flex-wrap:wrap;gap:6px;max-height:128px;overflow-y:auto;padding:2px;margin:0 -2px 8px}
.stc button{display:flex;align-items:center;gap:8px;max-width:100%;padding:4px 14px 4px 4px;border-radius:99px;background:var(--card);box-shadow:0 0 0 1px var(--ln);font-weight:800;font-size:13.5px;transition:background .2s,color .2s,box-shadow .2s,transform .15s}

.hint0{display:flex;flex-direction:column;gap:2px;margin-bottom:12px;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--yel) 28%,var(--card));font-size:13.5px}

.fold .in .pill{background:var(--bg)}.fold .in .pill.on{background:var(--acc)}

/* строка ученика */
.srow{transition:transform .15s}.srow:active{transform:scale(.985)}
.gt{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--yel);color:var(--yon);font-size:11px;font-weight:800;vertical-align:1px}

/* поле даты и мини-календарь */
.dbtn{display:flex;align-items:center;gap:10px;width:100%;margin:4px 0 2px;padding:12px;border-radius:12px;background:var(--card);box-shadow:0 0 0 1px var(--ln);font-size:16px;font-weight:700;text-align:left}

.bar .ttl{font-weight:900;text-transform:capitalize}

/* выбор времени */
.tg{grid-template-columns:repeat(6,1fr);margin-bottom:8px}

.dpc .tg button{background:var(--bg)}.dpc .tg button.on{background:var(--acc);color:var(--on)}

label.rep{display:flex;align-items:center;gap:12px;margin:4px 0 0;padding:12px 14px;border-radius:14px;background:var(--card);box-shadow:0 0 0 1px var(--ln);color:var(--tx);cursor:pointer}

@keyframes chp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--yel) 70%,transparent),0 10px 22px -8px rgba(15,46,110,.55)}70%,100%{box-shadow:0 0 0 14px transparent,0 10px 22px -8px rgba(15,46,110,.55)}}

/* синий квадрат при нажатии: системный tap-highlight WebView прямоугольный и не повторяет форму кнопки — отключаем везде;
   вместо него у каждой кнопки есть отклик по её форме (анимации, что были, не тронуты; недостающие добавлены ниже) */
*{-webkit-tap-highlight-color:transparent}
/* рамка фокуса WebView после касания (в старых WebView :focus-visible не поддерживается и рисуется синий контур) — убираем, для клавиатуры остаётся жёлтая */
button:focus,[role=button]:focus{outline:none}
button:focus-visible,[role=button]:focus-visible{outline:2.5px solid var(--yel);outline-offset:2px}
/* отклик на нажатие внутри самой кнопки, по её скруглённой форме (вместо системного квадрата) */

.fo:active{background:color-mix(in srgb,var(--acc) 8%,var(--card))}
.fo.on:active{background:color-mix(in srgb,var(--yel) 32%,var(--card))}
/* кнопки и строки, у которых раньше не было своего отклика (их «подсвечивал» только системный квадрат) */
.btn,.dbtn,.pill,.gauge,label.rep{transition:transform .15s,filter .2s}
.btn:active,.dbtn:active,.pill:active,.gauge:active,label.rep:active{transform:scale(.97);filter:brightness(.95)}
.btn.pri:active,.pill.on:active{filter:brightness(1.3)}
.gauge:active{filter:brightness(1.15)}
.btn:disabled:active{transform:none;filter:none}
.row,.feed,.kp{transition:transform .15s}
.lg{transition:background .2s,transform .15s}
.ls{transition:transform .15s,filter .2s}
.row:active,.feed:active,.kp:active,.lg:active{transform:scale(.985)}
.ls:active{transform:scale(.97);filter:brightness(.95)}
@media (prefers-reduced-motion:reduce){.btn,.dbtn,.pill,.gauge,label.rep,.row,.feed,.kp,.lg,.ls{transition-duration:.01ms}}
/* шапка таблицы расписания: колонки и линии строго совпадают с сеткой ниже */
.wg:not(.bw) .wh,.wg:not(.bw) .wb{grid-template-columns:38px repeat(7,minmax(0,1fr))}   /* minmax(0,…): ширина колонки не зависит от текста, шапка не «уезжает» от линий */
.wg:not(.bw) .wh{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 7%,var(--card)),color-mix(in srgb,var(--acc) 3%,var(--card)));border-bottom:1px solid var(--ln)}   /* нижняя линия — такая же, как линии часов */
.wg:not(.bw) .wh b{position:relative;min-width:0;overflow:hidden;gap:4px;padding:8px 2px 7px;font-size:11px;font-weight:800;letter-spacing:-.01em;color:var(--tx);border-left:1px solid var(--ln)}   /* те же 1px и цвет, что у вертикалей сетки */
.wg:not(.bw) .wh b:nth-child(n+7){color:var(--red)}
.wg:not(.bw) .wh em{margin:0;padding:1px 7px;border-radius:99px;background:var(--card);box-shadow:0 0 0 1px var(--ln);font-size:10px;font-weight:700;color:var(--hint);font-variant-numeric:tabular-nums}
.wg:not(.bw) .wh b.td{background:color-mix(in srgb,var(--yel) 26%,transparent)}
.wg:not(.bw) .wh b.td::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--yel)}
.wg:not(.bw) .wh b.td em{background:var(--yel);color:var(--yon);box-shadow:none}
.wg:not(.bw) .col.td{background-color:color-mix(in srgb,var(--yel) 9%,transparent)}   /* сегодняшний столбец чуть подсвечен по всей высоте */
.wg:not(.bw) .tl i:first-child{transform:translateY(3px)}   /* «08:00» стоит под линией шапки, а не под ней и поверх неё */
/* фильтр «Все ученики»: иконка в такой же ячейке, как у остальных фильтров */
.stb{padding:0 12px 0 0;gap:0}
.stb .ico{flex:none;display:grid;place-items:center;width:42px;height:46px;color:inherit}
.stb .ico .av{margin:0}
.stb .ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stb .chv{margin-left:4px}
.stb:active,.ib:active{transform:scale(.96)}
.stb,.ib{transition:background .2s,color .2s,transform .15s;-webkit-tap-highlight-color:transparent}
/* попапы фильтров оплат */
.fp .grb{display:block;width:40px;height:5px;border-radius:3px;background:var(--ln);margin:-10px auto 14px}
.fp .fh2{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.fp .fh2 .fhi{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:15px;background:var(--yel);color:var(--yon);box-shadow:0 8px 16px -10px #C58A00}
.fp .fh2 svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fp .fh2 h3{padding:0;margin:0;font-size:20px;line-height:1.15}.fp .fh2 p{margin:2px 0 0;font-size:13px;color:var(--hint)}
.fo{display:grid;grid-template-columns:44px 1fr 26px;align-items:center;gap:12px;width:100%;margin-bottom:8px;padding:11px 14px 11px 11px;border-radius:20px;background:var(--card);box-shadow:0 0 0 1px var(--ln);text-align:left;transition:background .2s,box-shadow .2s,transform .15s;-webkit-tap-highlight-color:transparent}
.fo:active{transform:scale(.98)}
.fo .fi{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--bg);color:var(--acc);transition:background .2s,color .2s}
.fo .fi svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fo .ft{min-width:0}.fo .ft b{display:block;font-size:15.5px;font-weight:800;line-height:1.2}.fo .ft small{display:block;margin-top:2px;font-size:12.5px;color:var(--hint)}
.fo .ft em{font-style:normal;display:inline-block;margin-left:6px;padding:0 7px;border-radius:99px;background:var(--bg);font-size:11.5px;font-weight:800;color:var(--hint);vertical-align:1px}
.fo .rd{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ln);color:transparent;transition:background .2s,color .2s,box-shadow .2s}
.fo .rd svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fo.on{background:color-mix(in srgb,var(--yel) 20%,var(--card));box-shadow:0 0 0 2px var(--acc),0 10px 20px -14px var(--sh)}
.fo.on .fi{background:var(--yel);color:var(--yon)}
.fo.on .rd{background:var(--acc);color:var(--on);box-shadow:none}
/* ===== Уведомления сверху экрана: свой цвет по смыслу, анимация появления/ухода, полоска времени ===== */
#toast{display:none;width:max-content;max-width:min(88vw,420px);padding:11px 16px 13px;border-radius:16px;border:0;font-weight:700;font-size:14px;line-height:1.3;text-align:left;overflow:hidden;pointer-events:none}
#toast.on{display:flex;align-items:center;gap:8px;animation:tIn .5s cubic-bezier(.2,1.25,.4,1) both}
#toast.on.out{animation:tOut .26s ease-in both}
#toast.k-ok{background:linear-gradient(135deg,#17A45A,#0E8A47);color:#fff;box-shadow:0 14px 28px -12px #0E8A47cc,0 0 0 1px #ffffff30 inset}
#toast.k-warn{background:linear-gradient(135deg,#FFD25A,#FFB92E);color:#3B2A00;box-shadow:0 14px 28px -12px #C58A00cc,0 0 0 1px #ffffff55 inset}
#toast.k-err{background:linear-gradient(135deg,#EA4B4B,#C9302F);color:#fff;box-shadow:0 14px 28px -12px #C9302Fcc,0 0 0 1px #ffffff30 inset}
#toast.k-info{background:linear-gradient(135deg,#3A3F52,#262A39);color:#fff;box-shadow:0 14px 28px -12px #0009,0 0 0 1px #ffffff1f inset}
#toast .tt{min-width:0}
#toast .te{flex:none;font-size:19px;line-height:1;animation:tPop .6s cubic-bezier(.2,1.6,.4,1) .15s both}
#toast .tb{position:absolute;left:0;bottom:0;height:3px;width:100%;background:currentColor;opacity:.35;transform-origin:left;animation:tBar 2.6s linear both}
@keyframes tIn{from{opacity:0;transform:translate(-50%,-26px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes tOut{to{opacity:0;transform:translate(-50%,-14px) scale(.96)}}
@keyframes tPop{from{opacity:0;transform:scale(.2) rotate(-25deg)}60%{transform:scale(1.25) rotate(8deg)}to{opacity:1;transform:none}}
@keyframes tBar{to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){#toast.on,#toast.on.out,#toast .te,#toast .tb{animation:none}}
/* варианты в списке учеников: те же карточки, без индикатора справа */
.fo.nr{grid-template-columns:44px 1fr}
.fo.nr .fi .av{margin:0}
.fo.on .fi .av{box-shadow:0 0 0 2px #fff8}
@keyframes foIn{from{opacity:0;transform:translateY(12px)}}
#sheet.on .fp .fo{animation:foIn .4s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(.05s + var(--i)*45ms)}
@media (prefers-reduced-motion:reduce){#sheet.on .fp .fo{animation:none}.fo,.fo .fi,.fo .rd,.stb,.ib{transition-duration:.01ms}}

/* ---------- Материалы: овальные чипсины + просмотр во весь экран ---------- */
.mt-h{font-size:13px;color:var(--hint);margin:2px 4px 10px}
.mt-list{display:flex;flex-direction:column;gap:10px}
.mt-chip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px 12px 12px;border-radius:99px;background:var(--card);box-shadow:0 0 0 1px var(--ln);font-weight:700;font-size:14px;line-height:1.25;transition:transform .15s,filter .2s}
.mt-chip:active{transform:scale(.97);filter:brightness(.95)}
.mt-chip .mi{flex:0 0 40px;height:40px;border-radius:50%;background:var(--yel);color:var(--yon);display:grid;place-items:center}
.mt-list .mi.mc{flex:0 0 58px;height:58px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--ln)}   /* обложки каталогов — круглые иконки покрупнее */
.mt-list .mi.mc img{width:100%;height:100%;object-fit:cover;display:block}
.mt-list .mt-chip{padding:9px 16px 9px 9px;gap:14px}
.mt-chip .mi svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mt-chip .mt-t{flex:1;min-width:0}
.mt-hl{display:inline-block;padding:1px 8px;border-radius:9px;background:color-mix(in srgb,var(--yel) 30%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--yel) 55%,transparent);white-space:nowrap}
.mt-chip .mg{flex:0 0 auto;color:var(--hint);font-size:20px;line-height:1}
#mv{display:none;position:fixed;inset:0;z-index:80;background:var(--bg);flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#mv.on{display:flex}
#mv.pg .mvb{display:none}   /* когда страница варианта загружена, её собственные хлебные крошки заменяют верхнюю полосу */
.mvb{display:flex;align-items:center;gap:10px;padding:8px 10px;flex:0 0 auto}
.mvb .pill{flex:0 0 auto}
.mvb b{flex:1;min-width:0;font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#mvf{flex:1;border:0;width:100%;background:var(--bg);margin-bottom:env(safe-area-inset-bottom,0px)}
#mvl{position:absolute;inset:56px 0 0;display:grid;place-items:center;color:var(--hint);font-size:14px;pointer-events:none}
#mvl[hidden]{display:none}
body:has(#mv.on) #sheet{z-index:90}   /* виджет Вишенки поверх открытого варианта */
.chs .fq{margin:0 6px 10px;padding:10px 12px;text-align:left;background:var(--card);border-radius:16px;box-shadow:0 0 0 1px var(--ln);border-left:5px solid var(--yel);color:var(--tx)}
.chs .fq span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font:14px/1.45 Georgia,"Times New Roman",serif;word-break:break-word}
.chs .fq small{display:block;margin-top:6px;font:700 11px/1.2 -apple-system,system-ui,sans-serif;color:var(--hint)}
.chs.frg .chb{width:72px;height:72px;margin-bottom:8px}
.chs.frg p{margin:4px 8px 10px;font-size:14px}
.chs.frg .zone{min-height:40px;margin-bottom:10px}
body:has(#mv.on) #sheet.on .sh{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}   /* поверх варианта плавающей кнопки Вишенки нет — запас снизу не нужен */
.chs .act.dn{gap:10px}.chs .act.dn button{flex:1 1 0;padding:13px 14px;opacity:1;pointer-events:auto}
.chs .act.dn .sec{background:var(--card);color:var(--tx);box-shadow:0 0 0 1.5px var(--ln)}
/* ── Прелоадер загрузки ─────────────────────────────────────────────────────
   Показывается на старте (#pl) и гаснет, когда кабинет получил данные:
   внизу страницы window.__bootRetry() зовёт window.__done() / window.__fail().
   Скоуп #pl — чтобы стили не смешивались с классами кабинета (.row, .bar, .sub). */
#pl{--vh:100vh;--w:min(100vw,560px,calc((var(--vh) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))/1.3));--navy:#1c2f6b;--gold:#f6a81c;position:fixed;inset:0;z-index:10000;background:#fbf7ee;overflow:auto;font-family:"Nunito","Quicksand","Trebuchet MS",system-ui,sans-serif;color:var(--navy);-webkit-user-select:none;user-select:none;transition:opacity .42s ease}
@supports (height:100dvh){#pl{--vh:100dvh}}
#pl.out{opacity:0;pointer-events:none}
#pl *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
#pl .page{min-height:100%;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#pl .wrap{width:var(--w)}
#pl .scene{position:relative;width:100%;height:0;padding-bottom:72.97%}
#pl .art{position:absolute;inset:0;animation:fl 6s ease-in-out infinite;-webkit-mask-image:linear-gradient(90deg,transparent,#000 2.5%,#000 97.5%,transparent),linear-gradient(180deg,transparent,#000 1%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 2.5%,#000 97.5%,transparent),linear-gradient(180deg,transparent,#000 1%);mask-composite:intersect}
#pl .base,#pl .l,#pl .sweep{position:absolute;inset:0}

/* «живые» слои: та же картинка, мягкая маска + лёгкое движение */
#pl .l{-webkit-mask-image:radial-gradient(ellipse var(--rx) var(--ry) at var(--cx) var(--cy),#000 55%,transparent 100%);mask-image:radial-gradient(ellipse var(--rx) var(--ry) at var(--cx) var(--cy),#000 55%,transparent 100%);transform-origin:var(--ox) var(--oy);will-change:transform}
#pl .sweep{background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.75) 50%,transparent 62%) 150% 0/250% 100%;mix-blend-mode:soft-light;animation:sw 5s ease-in-out infinite}
#pl .glow{position:absolute;left:79.3%;top:45.9%;width:calc(var(--w)*.15);height:calc(var(--w)*.15);margin:calc(var(--w)*-.075) 0 0 calc(var(--w)*-.075);border-radius:50%;background:radial-gradient(circle,rgba(255,214,70,.9),rgba(255,214,70,0) 68%);animation:glow 2.2s ease-in-out infinite}
#pl .sp{position:absolute;width:var(--s,calc(var(--w)*.04));height:var(--s,calc(var(--w)*.04));margin:-2% 0 0 -2%;background:linear-gradient(135deg,#ffe27a,#f6a81c);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);opacity:0;animation:tw 2.6s ease-in-out infinite}
#pl .card{position:relative;z-index:2;width:88.9%;margin:-7.97% auto 0;background:#fffdf2;padding:calc(var(--w)*.075) calc(var(--w)*.06) calc(var(--w)*.06);text-align:center;border-radius:50% 50% calc(var(--w)*.06) calc(var(--w)*.06)/calc(var(--w)*.0797) calc(var(--w)*.0797) calc(var(--w)*.06) calc(var(--w)*.06)}
#pl h1{font-size:calc(var(--w)*.072);white-space:nowrap;line-height:1.1;font-weight:900;letter-spacing:-.01em}
#pl .sub{margin:calc(var(--w)*.014) 0 0;color:inherit;font-size:calc(var(--w)*.029);line-height:1.25;font-weight:700}
#pl .row{display:flex;align-items:center;gap:3%;margin:calc(var(--w)*.04) auto 0;width:92%;background:none;border-radius:0;padding:0;box-shadow:none;cursor:default}
#pl .bar{display:block;flex:1;height:calc(var(--w)*.05);min-height:16px;border:3px solid var(--navy);border-radius:99px;background:#fff;overflow:hidden;padding:2px}
#pl #plf{height:100%;min-width:4%;border-radius:99px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.38) 0 9px,transparent 9px 18px),linear-gradient(#ffd24d,var(--gold));background-size:25.5px 100%,100% 100%;animation:st 0.7s linear infinite;box-shadow:0 0 12px rgba(246,168,28,.55)}
#pl .cap{width:calc(var(--w)*.1);flex:none;animation:cap 2s ease-in-out infinite}
#pl .info{display:flex;justify-content:space-between;gap:10px;margin:calc(var(--w)*.022) auto 0;width:92%;font-size:calc(var(--w)*.03);font-weight:800;opacity:.72;text-align:left}
#pl #plr{display:block;margin:calc(var(--w)*.03) auto 0;padding:calc(var(--w)*.025) calc(var(--w)*.06);border:0;border-radius:99px;background:var(--gold);color:var(--navy);font-weight:900;font-size:calc(var(--w)*.04);font-family:inherit}

<script>
/* Прелоадер кабинета. Договор с остальной страницей:
   window.__real(p)  — реальный прогресс (0–100), например от WebView-обёртки;
   window.__done()   — данные кабинета загружены, прелоадер гаснет;
   window.__fail()   — сервер недоступен: показать «Повторить»;
   window.__reset()  — сбросить состояние (кнопка «Повторить»).
   Загрузкой данных управляет window.__bootRetry() в конце страницы. */
(function(){
var $=function(i){return document.getElementById(i)},fill=$('plf'),pct=$('plp'),st=$('pls'),btn=$('plr'),
nat=!!window.NativePreloader,t0=Date.now(),real=0,shown=0,done=false,failed=false,ended=false;
function msg(s){return s<5?'Соединяемся с сервером…':s<25?'Будим сервер, подождите…':'Почти готово, ещё чуть-чуть…'}
window.__real=function(p){real=Math.max(real,p)};
window.__done=function(){done=true};
window.__fail=function(){failed=true;st.textContent='Не удалось подключиться. Проверьте интернет.';btn.hidden=false};
window.__reset=function(){failed=false;done=false;real=0;shown=0;t0=Date.now();btn.hidden=true};
btn.onclick=function(){window.__reset();
 if(nat&&window.NativePreloader)window.NativePreloader.retry();  // нативная обёртка перезагружает страницу сама
 else if(window.__bootRetry)window.__bootRetry()};               // мини-апп/браузер: повторяем загрузку данных
function dismiss(){ended=true;var pl=$('pl');if(!pl)return;pl.classList.add('out');setTimeout(function(){pl.remove()},460)}
function frame(){
 if(ended)return;
 var sec=(Date.now()-t0)/1000;
 if(!failed){
  var tgt=done?100:Math.min(93,Math.max(real*.9,93*(1-Math.exp(-sec/22))));
  shown+=(tgt-shown)*(done?.12:.04);if(done&&shown>99.5)shown=100;
  st.textContent=done?'Готово!':msg(sec);
 }
 fill.style.width=shown+'%';pct.textContent=Math.round(shown)+'%';
 if(done&&shown>=100){dismiss();return}
 requestAnimationFrame(frame)
}
frame()
})();
</script>

   по пути меняя цвет на цвет ученика, а в конце клетка коротко «вспыхивает». */
async function foldInto(day,sid,time){
  const sh=$("#sheet .sh"),from=sh&&sh.getBoundingClientRect();let fly=null,bd=null;
  if(!REDUCE&&from&&from.width>0&&sh.animate){
    fly=sh.cloneNode(true);fly.classList.add("fly");fly.setAttribute("aria-hidden","true");fly.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));
    Object.assign(fly.style,{left:from.left+"px",top:from.top+"px",width:from.width+"px",height:from.height+"px"});
    bd=document.createElement("div");bd.className="fly-bd";document.body.append(bd,fly)}
  close_();await load();
  if(!fly)return;
  try{
    const el=$(view=="m"?`.d[data-k="${day}"]`:`.ls[data-day="${day}"][data-sid="${sid}"][data-t="${time}"]`)||$(`.col[data-k="${day}"]`)||$(`.d[data-k="${day}"]`);
    if(!el)return;
    el.scrollIntoView({block:"center",inline:"center"});
    const to=el.getBoundingClientRect(),cs=getComputedStyle(fly),box=r=>({left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"});
    fly.classList.add("go");
    const opt={duration:620,easing:"cubic-bezier(.5,0,.15,1)",fill:"forwards"};
    await Promise.all([
      fly.animate([{...box(from),padding:cs.padding,borderRadius:"28px 28px 0 0",backgroundColor:cs.backgroundColor},
                   {...box(to),padding:"0px",borderRadius:el.classList.contains("d")?"12px":"7px",backgroundColor:hue(sid)}],opt).finished,
      bd.animate([{opacity:1},{opacity:0}],{duration:480,fill:"forwards"}).finished]);
    el.classList.add("pop");setTimeout(()=>el.classList.remove("pop"),800);
  }catch(e){}finally{fly.remove();bd.remove()}
}

/* Распределение оплат: все оплаты ученика идут по порядку и закрывают его занятия от старых к новым (каждое по своей цене).
   Результат для каждой оплаты: на какие занятия она пошла, полностью или частично; остаток — предоплата без занятия. */
function allocate(sid){
  const s=S.find(x=>x.id==sid),ls=L.filter(l=>l.sid==sid&&(l.price||0)>0).sort((a,b)=>(a.day+a.time<b.day+b.time?-1:1)),rem=ls.map(l=>l.price);
  const ps_=P.filter(p=>p.sid==sid).sort((a,b)=>a.at-b.at||a.id-b.id),res={};
  let older=Math.max(0,(s.paid||0)-ps_.reduce((a,p)=>a+p.amt,0));      // оплаты старше загруженных (сервер отдаёт последние 200)
  for(let i=0;i<ls.length&&older>0;i++){const t=Math.min(older,rem[i]);rem[i]-=t;older-=t}
  ps_.forEach(p=>{let left=p.amt;const list=[];
    for(let i=0;i<ls.length&&left>0;i++){if(rem[i]<=0)continue;const t=Math.min(left,rem[i]);rem[i]-=t;left-=t;list.push({l:ls[i],take:t,covered:ls[i].price-rem[i]})}
    res[p.id]={list,left}});
  return res}

const MAT_ICO='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 016.5 3H19v15H6.5A1.5 1.5 0 005 19.5z"/><path d="M5 19.5A1.5 1.5 0 006.5 21H19v-3M9 7.5h6M9 11h6"/></svg>';
let matTxt={},matIsOpen=false,matCat=null,matIdx={},matQ="";
function matTheme(){const t=document.documentElement.dataset.theme;return t==="dark"||(!t&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light"}   // страница варианта подстраивается под тему приложения
async function matGet(path){   // GET с входом, как у остальных /api/*; null — доступ закрыт (показан экран блокировки), ошибка сети/сервера — throw
  const h={"X-Init":tg.initData};if(APP&&localStorage.sesTok)h["X-Session"]=localStorage.sesTok;
  const r=await fetch(API_BASE+path,{headers:h});
  if(r.status==401||r.status==403){lockScreen(r.status);return null}
  if(!r.ok)throw 0;return r}
const MT_HL="(До 80 слов)";   // пометка в названии каталога — лёгким световым выделением
function mtT(s){return esc(s).split(MT_HL).join('<span class="mt-hl">'+MT_HL+'</span>')}
function mat(){return matCat===null?matCats():matVars()}
function matCats(){return `<p class="mt-h">Учебные материалы</p><div class="mt-list">${MATS.map((m,i)=>`<button class="mt-chip" type="button" onclick="matCatOpen(${i})"><span class="mi mc"><img src="${m.img}" alt="" draggable="false"></span><span class="mt-t">${mtT(m.t)}</span><span class="mg" aria-hidden="true">›</span></button>`).join("")}</div>`}
function matVars(){const m=MATS[matCat];
  return `<div class="mt-bar"><button class="pill" type="button" onclick="matBack()">‹ Материалы</button></div><p class="mt-h mt-cat">${mtT(m.t)}</p>
  <input id="mtq" class="srch" type="search" placeholder="🔍 Номер, автор или проблема" value="${esc(matQ)}" oninput="matFind(this.value)" autocomplete="off">
  <div class="mt-grid" id="mtg">${matGrid()}</div>`}
function matGrid(){const m=MATS[matCat],ix=matIdx[m.id];
  if(!ix)return `<p class="empty" style="grid-column:1/-1">Загружаю…</p>`;
  const q=matQ.trim().toLowerCase(),num=/^\d+$/.test(q);
  const L=ix.filter(v=>!q||(num?String(v.n).startsWith(q):v.q.toLowerCase().includes(q)));
  const about=q?"":`<button class="mt-chip mt-about" type="button" onclick="matOpen(${matCat},'about')"><span class="mi">${MAT_ICO}</span><span class="mt-t">О каталоге, критерии и источники</span><span class="mg" aria-hidden="true">›</span></button>`;
  return about+(L.length?L.map(v=>`<button class="mt-chip mt-v" type="button" onclick="matOpen(${matCat},${v.n})"><span class="mi mn">${v.n}</span><span class="mt-t"><b>Вариант ${v.n}</b><small>${esc(v.sub)}</small></span></button>`).join(""):`<p class="empty" style="grid-column:1/-1">Ничего не найдено</p>`)}
function matFind(v){matQ=v;const g=$("#mtg");if(g)g.innerHTML=matGrid()}
async function matCatOpen(i){const m=MATS[i];if(!m)return;
  matCat=i;matQ="";render();scrollTo({top:0,behavior:"instant"});
  if(matIdx[m.id])return;
  try{const r=await matGet("/api/materials/"+m.id);if(!r){matCat=null;return}
    matIdx[m.id]=(await r.json()).variants}
  catch(e){if(matCat===i)matCat=null;if(tab=="mt")render();toast("Не получилось загрузить каталог, попробуйте ещё раз");return}
  if(tab=="mt"&&matCat===i)render()}
function matBack(){matCat=null;matQ="";render();scrollTo({top:0,behavior:"instant"})}
async function matOpen(ci,part){   // part — номер варианта 1…36 или "about"
  const m=MATS[ci];if(!m||matIsOpen)return;
  const key=m.id+"/"+part,mv=$("#mv"),fr=$("#mvf"),ld=$("#mvl");
  mv.classList.remove("pg");$("#mvt").innerHTML=mtT(m.s)+" · "+(part=="about"?"О каталоге и источники":"Вариант "+part);fr.removeAttribute("src");fr.removeAttribute("srcdoc");ld.hidden=false;
  matIsOpen=true;mv.classList.add("on");
  try{history.pushState({mv:1},"")}catch(e){}
  try{tg.BackButton.show()}catch(e){}
  try{
    if(!matTxt[key]){
      const r=await matGet("/api/materials/"+key);
      if(!r){matClose();return}
      matTxt[key]=(await r.text()).replace(/src="vishenka(?:_cover)?\.png"/g,'src="'+$("#tmk").src+'"')}   /* обложка («о каталоге») ссылается на файл рядом — подставляем талисман, уже встроенный в приложение */
    if(!matIsOpen)return;
    /* Страница идёт во фрейм через srcdoc, а не через blob-URL: Android WebView не открывает blob:-ссылку
       внутри фрейма — навигация падает с net::ERR_FILE_NOT_FOUND («Webpage not available») вместо текста.
       Страницы вариантов самодостаточны (внешних src/href нет, обложка уже подменена на талисман),
       поэтому srcdoc работает одинаково на десктопе и в WebView. */
    fr.onload=()=>{ld.hidden=true;mv.classList.add("pg")};
    fr.srcdoc=matTxt[key].replace('<html lang="ru">','<html lang="ru" data-theme="'+matTheme()+'">');
    /* страховка: при ошибке загрузки onload может не прийти — не оставляем вечное «Загружаю…» */
    setTimeout(()=>{if(matIsOpen&&!mv.classList.contains("pg")){ld.hidden=true;toast("Не получилось открыть материал, попробуйте ещё раз")}},15000)}
  catch(e){ld.hidden=true;matClose();toast("Не получилось открыть материал, попробуйте ещё раз")}}
function matClose(fromPop){
  if(!matIsOpen)return;matIsOpen=false;
  const fr=$("#mvf");$("#mv").classList.remove("on","pg");fr.removeAttribute("src");fr.removeAttribute("srcdoc");
  if(!fromPop){try{if(history.state&&history.state.mv)history.back()}catch(e){}}
  if(!navOpen){try{tg.BackButton.hide()}catch(e){}}}
addEventListener("popstate",()=>{if(matIsOpen)matClose(true)});
addEventListener("message",e=>{if(!matIsOpen||e.source!==$("#mvf").contentWindow||!e.data||typeof e.data!=="object")return;
  if(e.data.matNav==="toc")matClose();   // «Оглавление» в хлебных крошках страницы → назад к сетке вариантов
  else if(e.data.matAsk)fragOpen(e.data.matAsk)});   // выделенный фрагмент + «Спросить у Вишенки»
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&matIsOpen)matClose()});

/* ---------- меню-гамбургер ---------- */
const ORDER=["c","p","s","ch","mt","kn"],NAMES={c:"Расписание",p:"Оплаты",s:"Ученики",ch:"Чат с ИИ",mt:"Материалы",kn:"Канал"};
const REDUCE=matchMedia("(prefers-reduced-motion:reduce)").matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let navOpen=false,navBusy=false;
function moveInd(b){const i=$("#nvi");if(b&&i){i.style.height=b.offsetHeight+"px";i.style.transform=`translateY(${b.offsetTop}px)`}}
function syncNav(){
  document.querySelectorAll(".mn-it").forEach(b=>{const on=b.dataset.t==tab;b.classList.toggle("on",on);on?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current")});
  moveInd($(".mn-it.on"));const t=$("#ttl");if(t&&t.textContent!==NAMES[tab])t.textContent=NAMES[tab]}
function setNav(on){
  if(navOpen===on)return;navOpen=on;
  const bg=$("#burger"),dw=$("#drawer");
  bg.classList.toggle("on",on);bg.setAttribute("aria-expanded",on);bg.setAttribute("aria-label",on?"Закрыть меню":"Открыть меню");
  dw.classList.toggle("on",on);$("#scrim").classList.toggle("on",on);dw.inert=!on;dw.setAttribute("aria-hidden",!on);
  try{on?tg.BackButton.show():tg.BackButton.hide()}catch(e){}
  if(on){syncNav();setTimeout(()=>{const a=$(".mn-it.on");if(navOpen&&a)a.focus({preventScroll:true})},80)}
  else if(dw.contains(document.activeElement))bg.focus({preventScroll:true})}
/* переход между разделами: подсветка плавно переезжает на выбранный пункт, меню закрывается ПАРАЛЛЕЛЬНО,
   старый раздел мягко растворяется, новый проявляется с лёгким подъёмом снизу (без сдвигов в стороны и масштаба) */
let navPend=null;
async function go(t,btn){
  if(navBusy){navPend=[t,btn];return}
  if(t===tab){setNav(false);return}
  navBusy=true;navPend=null;
  const app=$("#app"),ttl=$("#ttl");
  try{
    document.querySelectorAll(".mn-it").forEach(b=>b.classList.toggle("on",b===btn));moveInd(btn);
    setNav(false);
    if(!REDUCE){
      const out={duration:140,easing:"ease-out",fill:"forwards"};
      await Promise.all([app.animate([{opacity:1},{opacity:0}],out).finished,ttl.animate([{opacity:1},{opacity:0}],out).finished])}
    tab=t;render();scrollTo({top:0,behavior:"instant"});
    if(!REDUCE){
      app.getAnimations().forEach(a=>a.cancel());ttl.getAnimations().forEach(a=>a.cancel());
      const inn={duration:320,easing:"cubic-bezier(.22,1,.36,1)"};
      app.animate([{opacity:0,transform:"translateY(14px)"},{opacity:1,transform:"none"}],inn);
      ttl.animate([{opacity:0,transform:"translateY(6px)"},{opacity:1,transform:"none"}],{...inn,duration:260});
      const fb=$("#fab");if(fb.style.display==="block")fb.animate([{transform:"scale(.6)",opacity:0},{transform:"scale(1)",opacity:1}],{duration:340,easing:"cubic-bezier(.34,1.3,.64,1)",delay:80,fill:"backwards"})}
  }catch(e){app.getAnimations().forEach(a=>a.cancel());ttl.getAnimations().forEach(a=>a.cancel());tab=t;render()}
  finally{navBusy=false;if(navPend){const [pt,pb]=navPend;navPend=null;if(pt!==tab)go(pt,pb)}}}
$("#drawer").inert=true;
$("#burger").onclick=()=>setNav(!navOpen);
$("#scrim").onclick=()=>setNav(false);
$("#nv").onclick=e=>{const b=e.target.closest(".mn-it");if(b)go(b.dataset.t,b)};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&navOpen)setNav(false)});
try{tg.BackButton.onClick(()=>{if(matIsOpen)matClose();else setNav(false)})}catch(e){}
(()=>{let sx=null;const d=$("#drawer");
  d.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
  d.addEventListener("touchend",e=>{if(sx!==null&&e.changedTouches[0].clientX-sx<-60)setNav(false);sx=null},{passive:true})})();
addEventListener("scroll",()=>{const t=$("#top");if(t)t.classList.toggle("scr",scrollY>4)},{passive:true});
// долгий тап по кнопкам — не служебное меню обёртки (см. MainActivity: window.__lpOnBtn);
// иначе зажатие «Голосовая команда» открывало диалог «Сменить адрес сервера»
const lpMark=e=>{window.__lpOnBtn=!!(e.target.closest&&e.target.closest("button,a,input,select,textarea,[onclick]"))};
document.addEventListener("touchstart",lpMark,{passive:true});
document.addEventListener("mousedown",lpMark,{passive:true});
document.addEventListener("contextmenu",e=>{if(e.target.closest&&e.target.closest("button,a,input,select,textarea"))e.preventDefault()});
addEventListener("resize",syncNav);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(syncNav);
/* старт за прелоадером: показываем __done, когда данные пришли, и __fail, если связи нет */
window.__bootRetry=async()=>{try{await load();window.__done&&window.__done()}catch(e){window.__fail&&window.__fail()}};
window.__bootRetry();
</script></body></html>
