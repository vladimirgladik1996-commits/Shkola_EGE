# ============================================================
# Render Blueprint — «Кабинет репетитора» (bot.py: Telegram-бот + HTTP API)
#
# В репозитории две версии: dev/ (тест) и prod/ (рабочая). Каждый сервис
# ниже собирает свой каталог (rootDir) — Dockerfile и код лежат внутри него.
#
# Подключение (однократно):
#   Render Dashboard → New → Blueprint → выбрать репозиторий
#   vladimirgladik1996-commits/Shkola_EGE
#   Render сам прочитает этот файл и создаст оба сервиса.
#
# Секреты (BOT_TOKEN, AUTH_PASSWORD_HASH и т.п.) при деплое через Blueprint
# Render спросит в веб-форме (sync: false) — в репозиторий они не попадают.
# ============================================================

services:
  # ============================================================
  # PROD — рабочий сервис: каталог prod/bot-mini-app, живые данные.
  # Примечание: в корне репозитория лежит запасной Dockerfile (shim) — он
  # собирает тот же prod-код, если сервис продолжает строить из корня
  # (старые настройки до перестройки на dev/ и prod/).
  #
  # Бесплатный тариф (по требованию владельца). Следствия:
  #  • сервис «усыпает» после ~15 мин простоя — бот оживает при первом запросе;
  #  • диск на free недоступен, tutor.db НЕ переживает деплой/рестарт/засыпание —
  #    данные живут до ближайшего перезапуска сервиса.
  # ============================================================
  - type: web
    name: tutor-bot
    runtime: docker
    repo: https://github.com/vladimirgladik1996-commits/Shkola_EGE
    rootDir: prod/bot-mini-app
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    branch: main

    plan: free
    region: frankfurt

    # / отдаёт docs/index.html — подходит для health check
    healthCheckPath: /

    # автодеплой при пуше в main (заменяет SSH-скрипт deploy.sh)
    autoDeploy: true

    # Диск не используется: на бесплатном тарифе он недоступен.
    # (При переходе на платный тариф раскомментируйте — данные перестанут
    # теряться при деплоях: путь совпадает с DATA_DIR в bot.py.)
    # disk:
    #   name: tutor-data
    #   mountPath: /app/data
    #   sizeGB: 1

    envVars:
      # --- секреты: значения вводятся в панели Render, не в коде ---
      - key: BOT_TOKEN
        sync: false # токен от @BotFather (рабочий бот)
      - key: AUTH_LOGIN
        sync: false # логин входа в кабинет
      - key: AUTH_PASSWORD_HASH
        sync: false # scrypt-хэш пароля: python auth.py (--gen)
      - key: ALLOWED_USERNAMES
        sync: false # @ники через запятую, без @ (кому разрешён доступ)
      - key: ALLOWED_IDS
        sync: false # необязательно: числовые Telegram-ID
      - key: WEBAPP_URL
        sync: false # https://tutor-bot-cn4a.onrender.com/  (адрес этого сервиса)
      - key: PUBLIC_URL
        sync: false # тот же https-адрес (там открывается /login)

      # --- обычные настройки ---
      # Render сам выдаёт PORT — bot.py его читает (os.getenv("PORT", "8080")).
      - key: CURRENCY
        value: "₽"
      - key: APP_ENV
        value: "prod"

      # Анти-сон (free plan): бот каждые KEEPALIVE_SEC секунд сам пингует свой
      # публичный URL — входящий запрос через прокси Render сбрасывает 15-минутный
      # счётчик простоя. По умолчанию 180 с (3 минуты); для free достаточно < 900.
      - key: KEEPALIVE_SEC
        value: "180"

  # Секреты (BOT_TOKEN и др.) вводятся в панели Render при синхронизации
  # blueprint — в репозиторий они не попадают.
  # ВРЕМЕННО ОТКЛЮЧЕНО (не удалять!).
  # Сервис tutor-bot-dev добавляет в blueprint СЕКРЕТЫ sync: false
  # (BOT_TOKEN, AUTH_LOGIN, AUTH_PASSWORD_HASH, ALLOWED_USERNAMES,
  # WEBAPP_URL, PUBLIC_URL). Render не завершает синхронизацию blueprint,
  # пока их значения не введены в панели, и из-за этого НЕ ПРИМЕНЯЮТСЯ
  # изменения tutor-bot (rootDir) — деплои падают.
  # Как получите второго бота от @BotFather: раскомментируйте блок ниже
  # и введите значения секретов в панели Render при синхронизации.
  # ============================================================
  # ============================================================
  # DEV — тестовый сервис: каталог dev/bot-mini-app, тестовые данные.
  # Проверяем новые фичи здесь, потом переносим в prod/.
  #
  # Важно:
  #  • СВОЙ BOT_TOKEN — второго бота от @BotFather! Два сервиса с одним
  #    токеном конфликтуют (Telegram отдаёт апдейты одному из них наугад);
  #  • KEEPALIVE_SEC=0 — без антисна: dev спит после ~15 мин простоя и
  #    не тратит ограниченные 750 бесплатных часов (prod занимает ~730).
  #    Пробуждение — первый запрос, ~1 минута.
  # ============================================================
  - type: web
    name: tutor-bot-dev
    runtime: docker
    repo: https://github.com/vladimirgladik1996-commits/Shkola_EGE
    rootDir: dev/bot-mini-app
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    branch: main
    plan: free
    region: frankfurt
    healthCheckPath: /
    autoDeploy: true

    envVars:
      - key: BOT_TOKEN
        sync: false # СВОЙ токен от второго бота @BotFather (не рабочий!)
      - key: AUTH_LOGIN
        sync: false
      - key: AUTH_PASSWORD_HASH
        sync: false # можно тот же логин/пароль, что и в прод
      - key: ALLOWED_USERNAMES
        sync: false # те же люди, что и в прод
      - key: WEBAPP_URL
        sync: false # https://tutor-bot-dev-XXXX.onrender.com/ — адрес этого сервиса
      - key: PUBLIC_URL
        sync: false
      - key: CURRENCY
        value: "₽"
      - key: APP_ENV
        value: "dev"
      - key: KEEPALIVE_SEC
        value: "0"
      - key: LOG_LEVEL
        value: "DEBUG"

# ------------------------------------------------------------
# WEBAPP_URL = публичный HTTPS-адрес сервиса, например:
#   https://tutor-bot-cn4a.onrender.com/
# Схема «всё с одного домена»: этот же адрес отдаёт и страницу мини-аппа,
# и /api/*, и PDF — CORS и API_BASE не нужны.
# Этот же URL указать в @BotFather → /setmenubutton (или /newapp).
# Если мини-апп остаётся на GitHub Pages — дополнительно задать
# ALLOW_ORIGIN=https://vladimirgladik1996-commits.github.io
# и прописать API_BASE в docs/index.html (см. prod/bot-mini-app/DEPLOY.md, сценарий B).
# ------------------------------------------------------------
