<script>
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,0);
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const T=new Date();T.setHours(0,0,0,0);
const mon=d=>addD(d,-((d.getDay()+6)%7));
const WD=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"],WDF=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
const mins=t=>+t.slice(0,2)*60+ +t.slice(3);
const hm=m=>pad(Math.floor(m/60))+":"+pad(m%60);

const hue=id=>`hsl(${id*67%360} 45% 38%)`;
const money=n=>Math.abs(n).toLocaleString("ru-RU")+"\u00A0"+cur;

const tg=window.Telegram.WebApp;tg.ready();tg.expand();
let S=[],L=[],P=[],cur="₽";const w0=mon(T);
// API_BASE — откуда брать backend API.
// ""  → тот же домен (бот сам раздаёт страницу и API, всё как раньше);

  const t=document.createElement("div");

    :"🔒 Сессия устарела или доступ закрыт. Закройте кабинет (✕) и откройте его заново из чата с ботом.";d.appendChild(t);

  b.style.cssText="margin-top:22px;padding:12px 24px;font:inherit;font-weight:600;color:#fff;background:var(--tg-theme-button-color,#2481cc);border:0;border-radius:10px;cursor:pointer";
  b.onclick=()=>code==401?location.reload():tg.close();d.appendChild(b);
  document.body.appendChild(d)}
/* Вход происходит на странице /login (другая вкладка/браузер), а эта страница уже загружена и «заперта».
   Поэтому при возврате в кабинет (свернули-развернули, вернулись из браузера) пробуем обновиться сами —
   один раз за возврат, чтобы не зациклиться. */
let autoRetry=false;
const wake=()=>{if(locked&&!autoRetry&&document.visibilityState==="visible"){autoRetry=true;location.reload()}};
document.addEventListener("visibilitychange",wake);
if(tg.onEvent)tg.onEvent("activated",wake);

  if(r.status==401||r.status==403){lockScreen(r.status);return null}
  if(r.status==409){toast("Время занято или пересекается с другим занятием");return null}
  if(!r.ok){toast("Не получилось, попробуйте ещё раз");return null}return r.json()}

            {id:2,name:"Иван Петров",grade:"9",subject:"ОГЭ по математике",price:1500,paid:4500,done:4,balance:-1500,spent:6000,photo:null,deleted:0},

function fitNames(root){
  root.querySelectorAll(".ls").forEach(ls=>{const nm=ls.querySelector(".nm");if(!nm)return;
    const fit=()=>nm.scrollWidth<=nm.clientWidth+.5;
    nm.style.fontSize="";nm.querySelector(".t").textContent=nm.dataset.full;
    if(fit())return;
    nm.querySelector(".t").textContent=nm.dataset.short;if(fit())return;
    let k=1;while(!fit()&&k>.8){k-=.02;nm.style.fontSize=(8.9*k)+"px"}})}
function grid(start,bw){
  let H0=8,H1=21;const hh=bw?37.9:46,days=[...Array(7)].map((_,i)=>addD(start,i));
  const dk=days.map(iso),wl=L.filter(l=>dk.includes(l.day));   // сетка всегда 08–21, расширяется только если занятие выходит за границы
  if(wl.length){H0=Math.min(H0,Math.max(0,Math.min(...wl.map(l=>Math.floor(mins(l.time)/60)))));H1=Math.max(H1,Math.min(24,Math.max(...wl.map(l=>Math.ceil((mins(l.time)+l.dur)/60)))))}
  let h=`<div class="wg ${bw?"bw":""}" style="--hh:${hh}px"><div class="wh"><i></i>${days.map((d,i)=>`<b class="${!bw&&iso(d)==iso(T)?"td":""}">${bw?WDF[i]:WD[i]}<em>${bw?d.toLocaleDateString("ru-RU"):d.getDate()}</em></b>`).join("")}</div>
  <div class="wb" style="height:${(H1-H0)*hh}px"><div class="tl">${[...Array(H1-H0)].map((_,i)=>`<i style="top:${i*hh}px">${pad(H0+i)}:00</i>`).join("")}</div>`;
  days.forEach(d=>{
    h+=`<div class="col">`+L.filter(l=>l.day==iso(d)).map(l=>{
      const s=mins(l.time),top=(s-H0*60)/60*hh,ht=l.dur/60*hh-.8,st=stName(l.sid);
      if(bw){const g=stGrade(l.sid),np=nameParts(l.sid);
        return `<div class="ls" style="top:${top}px;height:${ht}px"><span class="r1">${l.time}–${hm(s+l.dur)}${l.rep?" ↻":""} <small>(${l.dur} мин)</small></span><span class="nm" data-full="${esc(np.full)}" data-short="${esc(np.short)}"><span class="t">${esc(np.full)}</span>${g?" "+esc(g):""}</span></div>`}
      return `<div class="ls" style="top:${top}px;height:${ht}px;background:${hue(l.sid)}" onclick="form(${l.id})">${esc(st.split(" ")[0])}<small>${l.time}–${hm(s+l.dur)}${l.rep?" ↻":""}</small></div>`}).join("")+`</div>`});
  return h+"</div></div>";
}

/* Распределение оплат: все оплаты ученика идут по порядку и закрывают его занятия от старых к новым (каждое по своей цене).
   Результат для каждой оплаты: на какие занятия она пошла, полностью или частично; остаток — предоплата без занятия. */
function allocate(sid){
  const s=S.find(x=>x.id==sid),ls=L.filter(l=>l.sid==sid&&(l.price||0)>0).sort((a,b)=>(a.day+a.time<b.day+b.time?-1:1)),rem=ls.map(l=>l.price);
  const ps_=P.filter(p=>p.sid==sid).sort((a,b)=>a.at-b.at||a.id-b.id),res={};
  let older=Math.max(0,(s.paid||0)-ps_.reduce((a,p)=>a+p.amt,0));      // оплаты старше загруженных (сервер отдаёт последние 200)
  for(let i=0;i<ls.length&&older>0;i++){const t=Math.min(older,rem[i]);rem[i]-=t;older-=t}
  ps_.forEach(p=>{let left=p.amt;const list=[];
    for(let i=0;i<ls.length&&left>0;i++){if(rem[i]<=0)continue;const t=Math.min(left,rem[i]);rem[i]-=t;left-=t;list.push({l:ls[i],take:t,covered:ls[i].price-rem[i]})}
    res[p.id]={list,left}});
  return res}
function payCard(id,isNew){
  const p=P.find(x=>x.id==id),s=S.find(x=>x.id==p.sid),a=allocate(p.sid)[id],pd=iso(p.at);
  const G={d:[],t:[],f:[]};
  a.list.forEach(x=>{const k=x.l.day<pd?"d":x.l.day==pd?"t":"f",full=x.covered>=x.l.price;
    G[k].push(`<div class="row" style="cursor:default;align-items:flex-start"><span class="info"><b>${dmy2(x.l.day)}</b>${full?"":`<small style="display:block">${k=="f"?"Частичная предоплата":"Частичная оплата"}: ${money(x.covered)} из ${money(x.l.price)}</small>`}</span><b>${money(x.l.price)}</b></div>`)});
  const sec=(t,k,extra="")=>G[k].length||extra?`<h2>${t}</h2>${G[k].join("")}${extra}`:"";
  const left=a.left>0?`<div class="row" style="cursor:default;align-items:flex-start"><span class="info"><b>Остаток без занятия</b><small style="display:block">Пока нет занятий, на которые его можно списать — останется предоплатой</small></span><b class="pos">+${money(a.left)}</b></div>`:"";
  const body=sec("Долги","d")+sec("Сегодня","t")+sec("Предоплаты","f",left)||'<p class="empty">Занятий с указанной ценой нет — сумма пошла в предоплату.</p>';
  const bl=s.b==0?money(0):(s.b>0?"+":"−")+money(s.b);
  open(`<div style="display:flex;align-items:center;gap:12px;padding-right:44px">${av(s)}<div><h3 style="padding:0">${isNew?"✅ Пополнение прошло успешно":esc(s.name)}</h3><p class="sub" style="margin:0">${isNew?esc(s.name):"Оплата · "+when(p.at)}</p></div></div>
  <div class="stat" style="margin:14px 0 4px"><small>Сумма пополнения</small><b class="pos" style="font-size:24px">+${money(p.amt)}</b></div>
  <h2 style="margin-top:14px">На что распределилась сумма</h2>${body}
  <div class="gauge ${s.b<0?"gneg":s.b>0?"gpos":"gzero"}">Баланс: ${bl}</div>
  <p class="gcap">${s.b<0?"Есть долги":s.b>0?"Есть предоплаты":"Все оплачено, долгов нет"}</p>
  <div class="btns">${isNew?'<button class="btn pri" onclick="close_()">Готово</button>':`<button class="btn" onclick="payEdit(${id})">Изменить сумму</button><button class="btn dng" onclick="payDel(${id})">Удалить платёж</button>`}</div>`)}
function payEdit(id){const p=P.find(x=>x.id==id);open(`<button class="pen" aria-label="Назад" onclick="payCard(${id})">‹</button><h3>Оплата — ${esc(stName(p.sid))}</h3><p class="sub">${when(p.at)}</p><label>Сумма<input id="pa" type="number" inputmode="numeric" value="${p.amt}"></label><div class="btns"><button class="btn pri" onclick="payOk(${id})">Сохранить</button><button class="btn dng" onclick="payDel(${id})">Удалить платёж</button></div>`)}

const PAL=["#1f7a6d","#d0813a","#5b6fd6","#c5486b","#7a9a2e","#8a5fb5"];
let ps="",pst="all",pd1="",pd2="",pty="all",cal;   // поиск, (резерв), период, тип записи, состояние календаря
/* Долги: оплата закрывает занятия от старых к новым; не закрытая часть прошедшего занятия — запись «долг» на дату занятия */
function debtEntries(){const out=[];
  S.forEach(s=>{let rem=s.paid||0;
    L.filter(l=>l.sid==s.id&&l.past&&(l.price||0)>0).sort((a,b)=>(a.day+a.time<b.day+b.time?-1:1)).forEach(l=>{
      if(rem>=l.price){rem-=l.price;return}
      out.push({k:"debt",sid:s.id,amt:l.price-rem,at:new Date(l.day+"T"+l.time),lid:l.id});rem=0})});
  return out}
function allEntries(){return P.map(p=>({k:"pay",id:p.id,sid:p.sid,amt:p.amt,at:p.at})).concat(debtEntries())}
function qMatch(e,q){
  const toks=norm(q.replace(/(\d)\s+(?=\d)/g,"$1")).split(/\s+/).filter(Boolean),nm=norm(stName(e.sid));
  return toks.every(t=>nm.includes(t)||(/^\d+$/.test(t)&&String(e.amt).includes(t)))}
function payFeedList(){
  const f=allEntries().filter(e=>(pty=="all"||e.k==pty)&&(!pd1||(iso(e.at)>=pd1&&iso(e.at)<=pd2))&&(!ps.trim()||qMatch(e,ps))).sort((a,b)=>b.at-a.at);
  if(!f.length)return '<p class="empty">Записей по этому фильтру нет.</p>';
  return f.map(e=>{const s=S.find(x=>x.id==e.sid);
    return e.k=="pay"?`<div class="feed" onclick="payCard(${e.id})">${av(s)}<span class="info"><b>${esc(s.name)}</b><small>Оплата · ${when(e.at)}</small></span><b class="pos">+${money(e.amt)}</b></div>`
      :`<div class="feed" onclick="card(${s.id})">${av(s)}<span class="info"><b>${esc(s.name)}</b><small>Долг за занятие · ${when(e.at)}</small></span><b class="neg">${money(e.amt)}</b></div>`}).join("")}

const dmy2=k=>k.slice(8)+"."+k.slice(5,7)+"."+k.slice(0,4);

    <div class="fl"><span><i class="r"></i>Уже оплачено наперёд</span><b>${money(cov)}</b></div>

    ${debtSum>0?`<div class="fl"><span><i class="d"></i>Старые долги, если вернут</span><b>+${money(debtSum)}</b></div>`:""}
    <div class="fh">По ученикам</div>${fRows.slice(0,5).map(([id,o])=>{const st=S.find(x=>x.id==id);return `<div class="dr" onclick="card(${id})">${av(st,"sm")}<div><b class="hbn" style="display:block">${esc(st.name)}</b><small style="color:var(--hint);font-size:12px">${o.n} ${plu(o.n,"занятие","занятия","занятий")}</small></div><b>${money(o.v)}</b></div>`}).join("")}${fRows.length>5?`<p class="note" style="margin:6px 0 0">и ещё ${fRows.length-5} ${plu(fRows.length-5,"ученик","ученика","учеников")}</p>`:""}`
    :'<p class="empty">На этот период занятий в расписании нет.</p>'}
    <p class="note" style="margin:10px 0 0;text-align:left">Сумма — по цене занятий из расписания, без учёта переносов. Предоплаты сначала закрывают ближайшие занятия.${far?" Регулярные занятия раскладываются на 12 недель вперёд — дальше прогноз может быть неполным.":""}</p></div>`;
  return h}
function debtPop(){
  const by={};debtEntries().filter(e=>!(S.find(x=>x.id==e.sid)||{}).deleted).forEach(e=>(by[e.sid]=by[e.sid]||[]).push(e));
  const sts=Object.keys(by).map(id=>({s:S.find(x=>x.id==id),l:by[id].sort((x,z)=>z.at-x.at),sum:by[id].reduce((t,e)=>t+e.amt,0)})).sort((x,z)=>z.sum-x.sum),tot=sts.reduce((t,x)=>t+x.sum,0);
  open(`<h3>Долги</h3><p class="sub">${sts.length?`${sts.length} ${plu(sts.length,"ученик","ученика","учеников")} · всего ${money(tot)}`:"Долгов нет"}</p>
  ${sts.map(x=>`<div class="row" onclick="card(${x.s.id})" style="margin-top:8px">${av(x.s,"sm")}<span class="info"><b>${esc(x.s.name)}</b><small>${x.l.length} ${plu(x.l.length,"занятие","занятия","занятий")}</small></span><b class="neg">${money(x.sum)}</b></div>${x.l.map(e=>`<div class="row" style="cursor:default;margin-left:18px;padding:7px 12px"><span class="info"><small>Занятие · ${dmy2(iso(e.at))}</small></span><b class="neg" style="font-size:14px">${money(e.amt)}</b></div>`).join("")}`).join("")||'<p class="empty">Долгов нет 🎉</p>'}`)}
function prePop(){
  const sts=act().filter(s=>s.b>0).sort((x,z)=>z.b-x.b).map(s=>{let av_=s.b;const items=[];
    L.filter(l=>l.sid==s.id&&!l.past&&(l.price||0)>0).sort((x,z)=>(x.day+x.time<z.day+z.time?-1:1)).forEach(l=>{if(av_<=0)return;const c=Math.min(av_,l.price);av_-=c;items.push({l,c})});
    return{s,items,left:av_}}),tot=sts.reduce((t,x)=>t+x.s.b,0);
  open(`<h3>Предоплаты</h3><p class="sub">${sts.length?`${sts.length} ${plu(sts.length,"ученик","ученика","учеников")} · всего ${money(tot)}`:"Предоплат нет"}</p>
  ${sts.map(x=>`<div class="row" onclick="card(${x.s.id})" style="margin-top:8px">${av(x.s,"sm")}<span class="info"><b>${esc(x.s.name)}</b><small>наперёд</small></span><b class="pos">+${money(x.s.b)}</b></div>${x.items.map(({l,c})=>`<div class="row" style="cursor:default;margin-left:18px;padding:7px 12px;align-items:flex-start"><span class="info"><small>Урок · ${dmy2(l.day)}, ${l.time}</small>${c<l.price?`<small style="display:block">Частичная предоплата: ${money(c)} из ${money(l.price)}</small>`:""}</span><b style="font-size:14px">${money(l.price)}</b></div>`).join("")}${x.left>0?`<div class="row" style="cursor:default;margin-left:18px;padding:7px 12px"><span class="info"><small>Остаток без занятия</small></span><b class="pos" style="font-size:14px">+${money(x.left)}</b></div>`:""}`).join("")||'<p class="empty">Предоплат нет.</p>'}`)}
function pay(){
  return `<div class="seg"><button class="${pv=="feed"?"on":""}" onclick="pv='feed';render()">Лента</button><button class="${pv=="dash"?"on":""}" onclick="pv='dash';render()">Дашборд</button></div>`+(pv=="feed"?payFeed():`<div id="dash" class="an">${payDash()}</div>`)}

/* ---------- Новая оплата (те же быстрые суммы, что и в боте: 3 000 / 5 000 / 10 000, либо ручной ввод) ---------- */
const PAY_QUICK=[3000,5000,10000];
function fabGo(){tab=="p"?payNew():form()}
function payNew(sid){
  if(!act().length)return toast("Сначала добавьте ученика");
  const cur_=sid||(pst!="all"?pst:act()[0].id);
  open(`<h3>Новая оплата</h3><p class="sub">Выберите ученика и сумму</p>
  <label>Ученик<select id="pns">${act().map(s=>`<option value="${s.id}" ${s.id==cur_?"selected":""}>${esc(s.name)}</option>`).join("")}</select></label>
  <label>Быстрая сумма</label><div class="chips" style="margin-bottom:10px">${PAY_QUICK.map(a=>`<button class="pill" onclick="payAdd(${a})">${a.toLocaleString("ru-RU")}</button>`).join("")}</div>
  <label>Или введите сумму<input id="pna" type="number" inputmode="numeric" placeholder="Например, 4500"></label>
  <div class="btns"><button class="btn pri" onclick="payAdd()">Внести оплату</button></div>`);
}
async function payAdd(a){
  const sid=+$("#pns").value,v=a||parseInt($("#pna").value,10);
  if(!v||v<=0)return toast("Введите сумму больше нуля");
  const r=await api("/api/payment/add",{student_id:sid,amount:v});if(!r)return;
  close_();await load();if(r.id&&P.find(x=>x.id==r.id))payCard(r.id,1);else toast("Оплата принята: +"+money(v)+" · "+stName(sid));
}

/* ---------- Ученики: поиск, фильтр по классу, добавление, карточка ---------- */
const GRADES=[...Array(11)].map((_,i)=>i+1),PRICE_QUICK=[3000,4000,5000];
let sq="",sg="all",ph;   // поиск, фильтр класса, выбранное фото (undefined — не менялось, "" — убрать)
const gtxt=g=>{g=(g||"").trim();return /^\d+$/.test(g)?g+" класс":g};
function stuGrades(){return [...new Set(act().map(s=>(s.grade||"").trim()).filter(Boolean))].sort((a,b)=>(+a||99)-(+b||99)||a.localeCompare(b))}
function stu(){
  const gs=stuGrades();
  return `<div class="sbar"><input id="ssr" class="srch" type="search" placeholder="🔍 Поиск по имени" value="${esc(sq)}" oninput="sq=this.value;stuUpd()">
  <label class="ib ${sg!="all"?"on":""}" id="sfl" title="Фильтр по классу"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
    <select onchange="sg=this.value;stuUpd();$('#sfl').classList.toggle('on',sg!='all')" aria-label="Класс"><option value="all">Все классы</option>${gs.map(g=>`<option value="${esc(g)}" ${sg==g?"selected":""}>${esc(gtxt(g))}</option>`).join("")}<option value="none" ${sg=="none"?"selected":""}>Без класса</option></select></label>
  <button class="ib acc" onclick="studNew()" aria-label="Добавить ученика">＋</button></div><div id="slist">${stuList()}</div>`}
function stuUpd(){$("#slist").innerHTML=stuList()}
function stuList(){
  const q_=sq.trim().toLowerCase(),f=act().map(bal).filter(s=>(!q_||nameMatch(s.name,q_))&&(sg=="all"||(sg=="none"?!(s.grade||"").trim():(s.grade||"").trim()==sg)));
  if(!f.length)return '<p class="empty">Учеников по этому запросу нет.</p>';
  return f.map(s=>{const t=!s.price?"цена не указана":s.b<0?"долг "+money(s.b):s.b>0?"наперёд "+money(s.b):"всё оплачено",g=gtxt(s.grade);
    return `<div class="srow" onclick="card(${s.id})">${av(s)}<span class="info"><b>${esc(s.name)}</b><small>${g?esc(g)+" · ":""}${s.price?money(s.price)+" / занятие · ":""}проведено ${s.done}</small></span><b class="${s.b<0?"neg":s.b>0?"pos":""}">${t}</b></div>`}).join("")}

/* фото: центр-квадрат 360×360, JPEG — сервер принимает data-URL до ~500 КБ */
function pickPhoto(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(im.width,im.height),c=document.createElement("canvas");c.width=c.height=360;
    c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,360,360);ph=c.toDataURL("image/jpeg",.85);phShow()};im.src=r.result};r.readAsDataURL(f)}
function phShow(){const v=$("#phv");if(!v)return;v.style.background=ph?`url(${ph}) center/cover`:"var(--card)";v.textContent=ph?"":"📷"}
function photoField(cur){ph=undefined;cur=safePhoto(cur);
  return `<div class="phr"><span id="phv" class="av big" style="margin:0;${cur?`background:url(${cur}) center/cover`:"background:var(--card)"}">${cur?"":"📷"}</span>
  <div class="phb"><label class="pill">Выбрать фото<input type="file" accept="image/*" style="display:none" onchange="pickPhoto(this)"></label><button class="pill" onclick="ph='';phShow()">Убрать</button></div></div>`}
const gradeSel=(id,cur)=>{cur=(cur||"").trim();const L_=GRADES.map(String);return `<select id="${id}"><option value="">Не указан</option>${(cur&&!L_.includes(cur)?[cur]:[]).concat(L_).map(g=>`<option value="${esc(g)}" ${g==cur?"selected":""}>${esc(gtxt(g))}</option>`).join("")}</select>`};
const priceField=(id,v)=>`<label>Цена за занятие, ₽</label><div class="chips" style="margin-bottom:6px">${PRICE_QUICK.map(a=>`<button class="pill" onclick="$('#${id}').value=${a}">${a.toLocaleString("ru-RU")}</button>`).join("")}</div><input id="${id}" type="number" inputmode="numeric" placeholder="Или введите свою цену" value="${v||""}">`;
function studNew(){
  open(`<h3>Новый ученик</h3><p class="sub">Обязательно только имя</p>${photoField("")}
  <label>Имя и фамилия *<input id="nn" placeholder="Как зовут ученика?" autocomplete="off"></label>
  <label>Класс${gradeSel("ng","")}</label>
  <label>Предмет<input id="nsb" placeholder="Например: ЕГЭ по русскому"></label>${priceField("np","")}
  <div class="btns"><button class="btn pri" onclick="studAdd()">Сохранить</button></div>`);
}
async function studAdd(){
  const name=$("#nn").value.trim();if(!name)return toast("Введите имя ученика");
  const b={name,grade:$("#ng").value,subject:$("#nsb").value.trim(),price:Math.max(0,parseInt($("#np").value,10)||0)};if(ph)b.photo=ph;
  const r=await api("/api/student/add",b);if(!r)return;
  close_();await load();toast("Ученик добавлен: "+name);
}
function card(id,ed){
  const s=bal(S.find(x=>x.id==id));
  if(ed)return open(`<h3>Редактирование профиля</h3><p class="sub">${esc(s.name)}</p>${photoField(s.photo)}
    <label>Имя и фамилия<input id="en" value="${esc(s.name)}"></label><label>Класс${gradeSel("eg",s.grade)}</label>
    <label>Предмет<input id="es" value="${esc(s.subject||"")}"></label>${priceField("ep",s.price)}<p class="sub" style="margin-top:6px">Новая цена применится к будущим занятиям. Уже проведённые останутся по прежней цене.</p>
    <div class="btns"><button class="btn pri" onclick="saveS(${id})">Сохранить</button><button class="btn" onclick="card(${id})">Отмена</button></div>`);
  const mine=P.filter(p=>p.sid==id).sort((a,b)=>b.at-a.at),last=mine.slice(0,5),td=iso(T),plan=L.filter(l=>l.sid==id&&l.day>=td).length;
  const bt=!s.price?"Цена не указана — долг не считается":s.b<0?"🔴 Текущий долг: "+money(s.b):s.b>0?"🟢 Оплачено наперёд: "+money(s.b):"✅ Долга нет";
  const info=(k,v)=>`<div class="row" style="cursor:default"><span class="info">${k}</span><b>${v}</b></div>`;
  open(`${s.deleted?"":`<button class="pen" aria-label="Редактировать профиль" onclick="card(${id},1)">✏️</button>`}${av(s,"big")}<h3 style="text-align:center;padding:0">${esc(s.name)}</h3>
  <p class="sub" style="text-align:center">${[gtxt(s.grade),s.subject].filter(Boolean).map(esc).join(" · ")||"класс и предмет не указаны"}</p>
  <button class="gauge ${s.b<0?"gneg":s.b>0?"gpos":"gzero"}" onclick="balPop(${id})">${s.b==0?money(0):(s.b>0?"+":"−")+money(s.b)}</button>
  <p class="gcap">${s.b<0?"Есть долг":s.b>0?"Есть предоплата":"Все уроки оплачены вовремя"}</p>
  <div class="cst"><div class="stat"><small>Занятий проведено</small><b>${s.done}</b></div><div class="stat"><small>Оплачено всего</small><b>${money(s.paid)}</b></div>
  <div class="stat"><small>Количество оплат</small><b>${mine.length}</b></div><div class="stat"><small>Занятий впереди</small><b>${plan}</b></div></div>
  ${info("Класс",esc(gtxt(s.grade)||"—"))}${info("Предмет",esc(s.subject||"—"))}${info("Цена за занятие",s.price?money(s.price):"не указана")}${info("Стоимость проведённых",money(s.spent||0))}
  <h2>Последние платежи</h2>${last.map(p=>`<div class="row" style="cursor:default"><span class="info">${when(p.at)}</span><b class="pos">+${money(p.amt)}</b></div>`).join("")||'<p class="empty">Платежей ещё не было.</p>'}${s.deleted?'<p class="note">Ученик удалён. История занятий и оплат сохранена.</p>':`<div class="btns" style="margin-top:18px"><button class="btn dng" onclick="studDel(${id})">Удалить ученика</button></div>`}`);
}
function studDel(id){const s=S.find(x=>x.id==id);
  tg.showConfirm(`Удалить ученика «${s.name}»? Прошлые занятия и оплаты останутся в истории, будущие занятия будут убраны.`,async ok=>{if(ok&&await api("/api/student/delete",{id})){close_();await load();toast("Ученик удалён")}})}
function balPop(id){
  const s=S.find(x=>x.id==id),pays=P.filter(p=>p.sid==id).sort((a,b)=>b.at-a.at).slice(0,8),ds=debtEntries().filter(e=>e.sid==id).sort((a,b)=>b.at-a.at);
  open(`<button class="pen" aria-label="Назад" onclick="card(${id})">‹</button><h3>Оплаты и долги</h3><p class="sub">${esc(s.name)}</p>
  <h2 style="margin-top:6px">Последние оплаты</h2>${pays.map(p=>`<div class="row" style="cursor:default"><span class="info">${when(p.at)}</span><b class="pos">+${money(p.amt)}</b></div>`).join("")||'<p class="empty">Оплат ещё не было.</p>'}
  <h2>Долги</h2>${ds.map(e=>`<div class="row" style="cursor:default"><span class="info">Занятие · ${when(e.at)}</span><b class="neg">${money(e.amt)}</b></div>`).join("")||'<p class="empty">Долгов нет.</p>'}`)}
async function saveS(id){const n=$("#en").value.trim();if(!n)return toast("Введите имя");
  const b={id,name:n,grade:$("#eg").value,subject:$("#es").value.trim(),price:Math.max(0,parseInt($("#ep").value,10)||0)};if(ph!==undefined)b.photo=ph;
  if(await api("/api/student/update",b)){await load();card(id);toast("Профиль сохранён")}}

/* ---------- каркас ---------- */
function open(h){$("#sheet").innerHTML=`<div class="bd" onclick="close_()"></div><div class="sh">${h}</div>`;$("#sheet").classList.add("on")}
function close_(){$("#sheet").classList.remove("on")}
function render(){$("#app").innerHTML=tab=="c"?sched():tab=="p"?pay():stu();const fb=$("#fab");fb.style.display=tab=="c"?"block":"none";fb.textContent="+ Занятие";document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab))}
$("nav").onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;render();scrollTo(0,0)}};
load();
</script></body></html>
